- name: Build directly with Clang (No CMake)
  run: |
    mkdir -p build
    $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
    -shared -o build/libzygisk.so \
    -fPIC -std=c++17 -O2 \
    -static-libstdc++ \
    -I . \
    main.cpp \
    -Wl,--allow-shlib-undefined -Wl,--unresolved-symbols=ignore-all \
    -llog
