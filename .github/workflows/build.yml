name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Build with CMake
      run: |
        mkdir -p build
        cd build
        # 直接在当前仓库根目录寻找 CMakeLists.txt
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 ..
        make -j$(nproc)

    - name: Upload SO artifact
      uses: actions/upload-artifact@v4
      with:
        name: libzygisk
        path: build/libzygisk.so
