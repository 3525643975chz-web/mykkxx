name: Build SO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Download zygisk.hpp
        run: |
          curl -sSL https://raw.githubusercontent.com/topjohnwu/Magisk/master/native/src/zygisk/zygisk.hpp -o zygisk.hpp

      - name: Build arm64-v8a
        run: |
          mkdir -p build64 zygisk/arm64-v8a
          cmake -S . -B build64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build64
          cp build64/libmeovra.so zygisk/arm64-v8a/

      - name: Build armeabi-v7a
        run: |
          mkdir -p build32 zygisk/armeabi-v7a
          cmake -S . -B build32 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-27 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build32
          cp build32/libmeovra.so zygisk/armeabi-v7a/

      - uses: actions/upload-artifact@v4
        with:
          name: meovra_so
          path: zygisk
